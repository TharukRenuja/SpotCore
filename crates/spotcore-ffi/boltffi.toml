[package]
name = "spotcore"
crate = "spotcore-ffi"

[targets.python]
enabled = true
module_name = "spotcore"
output = "../../bindings/python/generated"

[targets.csharp]
enabled = true
namespace = "SpotCore"
module_class = "SpotCoreApi"
output = "../../bindings/dotnet/generated"
runtime_identifiers = ["current"]

[targets.java]
package = "dev.spotcore"
module_name = "SpotCore"
min_version = 16

[targets.java.jvm]
enabled = true
output = "../../bindings/java/generated"
host_targets = ["current"]

[targets.android]
enabled = true

[targets.android.kotlin]
package = "dev.spotcore"
module_name = "SpotCore"
desktop_loader = "bundled"
output = "../../bindings/kotlin/generated"

[targets.apple]
enabled = true
include_macos = true

[targets.apple.swift]
module_name = "SpotCore"
ffi_module_name = "SpotCoreFFI"
output = "../../bindings/swift/generated"

[targets.dart]
enabled = true
output = "../../bindings/dart/generated"
