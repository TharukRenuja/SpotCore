[package]
name = "spotcore-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
spotcore-ffi = { path = "../spotcore-ffi" }
napi = { version = "=3.16.1", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "=3.7.0"

[build-dependencies]
napi-build = "=2.6.0"
