name: CI

on:
  push:
    branches: [main, "feat/**", "release/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system-engine development libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo build -p spotcore-engine --locked
      - run: cargo test --workspace --all-features
      - run: cargo check -p spotcore --no-default-features
      - run: cargo check -p spotcore --no-default-features --features native
      - run: node crates/web/tests/js/bridge.test.cjs
      - run: node crates/web/tests/js/services.test.cjs

  sdk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ""
          - os: windows-latest
            exe: .exe
          - os: macos-latest
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p spotcore-engine --locked
      - run: cargo test -p spotcore -p spotcore-core -p spotcore-auth -p spotcore-web -p spotcore-native --all-features --locked
        env:
          SPOTCORE_LAUNCHER: ${{ github.workspace }}/target/debug/spotcore-engine${{ matrix.exe }}
      - run: cargo check -p spotcore --examples --all-features --locked
      - run: cargo check -p spotcore --no-default-features --locked
      - run: cargo check -p spotcore --no-default-features --features native --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p spotcore --all-features --examples --locked
      - run: cargo check -p spotcore-ffi -p spotcore-node --locked

  bindings-node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global typescript@5.7.3
      - run: cargo test -p spotcore-ffi --locked
      - run: python scripts/check_bindings.py node

  system-engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install Linux runtime and display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb dbus-x11
      - name: Ensure WebView2 Runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $installed = $keys | ForEach-Object { (Get-ItemProperty $_ -ErrorAction SilentlyContinue).pv } | Where-Object { $_ -and $_ -ne '0.0.0.0' }
          if (-not $installed) {
            $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
            $signature = Get-AuthenticodeSignature $setup
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Microsoft Corporation*') { throw 'Invalid WebView2 installer signature' }
            $process = Start-Process $setup -ArgumentList '/silent','/install' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "WebView2 install failed: $($process.ExitCode)" }
          }
      - run: cargo build -p spotcore-system-engine --locked
      - run: cargo clippy -p spotcore-system-engine --all-targets --locked -- -D warnings
      - name: Native JavaScript and messaging smoke test
        shell: bash
        run: |
          engine() {
            if [ "$RUNNER_OS" = "Linux" ]; then
              SPOTCORE_SP_DC=synthetic-session xvfb-run -a dbus-run-session -- cargo run -p spotcore-system-engine --locked -- "$@"
            else
              cargo run -p spotcore-system-engine --locked -- "$@"
            fi
          }
          engine --smoke --profile-dir "$RUNNER_TEMP/spotcore-system-one" --cookie-value first --expect-cookie first
          engine --smoke --profile-dir "$RUNNER_TEMP/spotcore-system-one" --expect-cookie first
          engine --smoke --profile-dir "$RUNNER_TEMP/spotcore-system-two" --expect-cookie absent
          engine --smoke --profile-dir "$RUNNER_TEMP/spotcore-system-two" --cookie-value second --expect-cookie second
          engine --smoke --profile-dir "$RUNNER_TEMP/spotcore-system-one" --expect-cookie first
      - name: Remove isolated platform profile
        shell: bash
        run: |
          engine() {
            if [ "$RUNNER_OS" = "Linux" ]; then
              env -u DISPLAY -u WAYLAND_DISPLAY cargo run -p spotcore-system-engine --locked -- "$@"
            else
              cargo run -p spotcore-system-engine --locked -- "$@"
            fi
          }
          engine --forget --profile-dir "$RUNNER_TEMP/spotcore-system-one"
          engine --forget --profile-dir "$RUNNER_TEMP/spotcore-system-two"
      - name: Diagnose Windows profile files
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem "$env:RUNNER_TEMP/spotcore-system-one" -Recurse -Force | Select-Object FullName,Length
      - name: Diagnose macOS profile cleanup failure
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: lldb --batch -o run -k 'thread backtrace all' -- target/debug/spotcore-system-engine --forget --profile-dir "$RUNNER_TEMP/spotcore-system-one"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-engine-${{ matrix.os }}
          path: |
            target/debug/spotcore-system-engine
            target/debug/spotcore-system-engine.exe
            ~/Library/Logs/DiagnosticReports/spotcore-system-engine*
          if-no-files-found: error
