[package]
name = "spotcore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true

[workspace]
members = ["crates/core", "crates/web", "crates/auth", "crates/native", "crates/spotcore-ffi", "crates/spotcore-node", "host/system", "host/launcher"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"

[workspace.dependencies]
spotcore-core = { path = "crates/core" }
spotcore-auth = { path = "crates/auth" }
spotcore-native = { path = "crates/native" }

[features]
default = ["web"]
web = ["dep:spotcore-web", "dep:tokio"]
native = ["dep:spotcore-native", "dep:tokio"]

[dependencies]
spotcore-web = { path = "crates/web", optional = true }
spotcore-native = { path = "crates/native", optional = true }
spotcore-core.workspace = true
spotcore-auth.workspace = true
tokio = { version = "1", features = ["time", "sync", "rt"], optional = true }

[dev-dependencies]
serde_json = "1"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.28"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }

[[example]]
name = "services"
required-features = ["web"]

[[example]]
name = "multi_account"
required-features = ["web"]

[[example]]
name = "web"
required-features = ["web"]

[[example]]
name = "quickstart"
required-features = ["web"]

[[example]]
name = "native_playback"
required-features = ["native"]

[profile.release]
lto = "fat"
panic = "abort"
opt-level = "z"
codegen-units = 1
strip = true
