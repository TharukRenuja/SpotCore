[package]
name = "spotcore-system-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true

[dependencies]
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
wry = { version = "0.57.1", default-features = false, features = ["os-webview"] }
tao = { version = "0.37", default-features = false, features = ["rwh_06", "x11"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_Foundation"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
soup3 = "0.5"
